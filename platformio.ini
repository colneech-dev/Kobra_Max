#
# Marlin Firmware — Kobra Max (HC32F460KCTA)
# PlatformIO Configuration
#

[platformio]
src_dir         = source/Marlin
default_envs    = HC32F460E_kobra_max

# ──────────────────────────────────────────────────────────────────────────────
# Kobra Max — HC32F460xExx (512K Flash, 192K RAM)
# Bootloader offset: 0xC000  (Anycubic secondary bootloader)
# ──────────────────────────────────────────────────────────────────────────────
[env:HC32F460E_kobra_max]

# Platform + pinned framework packages (matches locally installed versions)
platform          = hc32f46x@1.1.1
platform_packages =
  framework-hc32f46x-ddl@https://github.com/shadow578/framework-hc32f46x-ddl/archive/2.2.2.zip
  framework-arduino-hc32f46x@https://github.com/shadow578/framework-arduino-hc32f46x/archive/1.3.1.zip

framework                    = arduino
board                        = generic_hc32f460
board_upload.maximum_size    = 524288
board_upload.offset_address  = 0xC000
board_build.boot_mode        = secondary

build_type = release

# HC32 app configuration (included in every translation unit by the build system)
board_build.app_config = Marlin/src/HAL/HC32/app_config.h

# DDL peripheral drivers required by the HC32 HAL
board_build.ddl.ots    = true
board_build.ddl.sdioc  = true
board_build.ddl.wdt    = true
board_build.ddl.timer0 = true
board_build.ddl.timera = true
board_build.mw.sd_card = true

# Library dependencies
lib_deps =
  teemuatlut/TMCStepper@^0.7.3

# Build flags
build_flags =
  -DARDUINO_ARCH_HC32
  -D__MARLIN_FIRMWARE__
  -DNDEBUG
  -DPLATFORM_M997_SUPPORT
  -DBOARD_XTAL_FREQUENCY=8000000
  -g3
  -fno-signed-char

# C++ flags
board_build.flags.cpp =
  -fno-threadsafe-statics
  -fno-exceptions
  -fno-rtti

# Source filter: include all Marlin src, swap STM32 HAL for HC32 HAL
build_src_filter =
  +<src/>
  -<src/HAL/STM32>
  +<src/HAL/HC32>
  +<src/HAL/shared>
